# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=travelagency

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:local_dev_jwt_secret_key_that_is_definitely_long_enough_12345}
app.jwt.ttl-hours=24

# CORS Configuration
app.cors.allowed-origins=https://sprint1-run23-team3-develop-dev-deploy.development.krci-dev.cloudmentor.academy,http://team3-frontend-bucket.s3-website.eu-west-3.amazonaws.com

# Authentication Configuration
app.auth.max-failed-attempts=5
app.auth.lockout-minutes=15

# Logging
logging.level.org.springframework.data.mongodb=WARN

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
app.server.url=${APP_SERVER_URL:https://sprint1-run23-team3-develop-dev-deploy.development.krci-dev.cloudmentor.academy}

# Document storage
app.documents.storage-provider=mongodb
app.documents.max-file-size-bytes=2097152

# S3 settings
app.documents.s3.enabled=true
app.documents.s3.bucket=${AWS_S3_BUCKET:team3-files-bucket}
app.documents.s3.region=${AWS_REGION:eu-west-3}
app.documents.s3.key-prefix=tour-documents
app.documents.s3.endpoint=
app.documents.s3.path-style-access-enabled=false

# AES-256 key for document encryption (32-byte key, base64-encoded)
app.documents.security.encryption-key-base64=${DOCUMENTS_ENCRYPTION_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}

# Antivirus integration (ClamAV)
app.documents.clamav.enabled=${CLAMAV_ENABLED:false}
app.documents.clamav.host=${CLAMAV_HOST:localhost}
app.documents.clamav.port=${CLAMAV_PORT:3310}

# Document retention cleanup
app.documents.retention.unverified-days=${DOCUMENTS_RETENTION_UNVERIFIED_DAYS:2}
app.documents.retention.cleanup-cron=${DOCUMENTS_RETENTION_CLEANUP_CRON:0 0 * * * *}

# RabbitMQ (set app.rabbitmq.enabled=true to activate event publishing)
app.rabbitmq.enabled=${APP_RABBITMQ_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.exchange=travel-agency.exchange
app.rabbitmq.queue=booking.events.queue
app.rabbitmq.routing-key=booking.event

# AWS S3 Configuration
aws.access-key=${AWS_ACCESS_KEY:}
aws.secret-key=${AWS_SECRET_KEY:}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:eu-west-3}
aws.s3.bucket=${AWS_S3_BUCKET:team3-files-bucket}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Password Reset Configuration
app.password-reset.code-expiry-minutes=15
app.password-reset.from-email=${MAIL_USERNAME}
