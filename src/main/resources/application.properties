# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=travelagency

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=24

# CORS Configuration
app.cors.allowed-origins=http://localhost:[*],https://localhost:[*],https://sprint1-run23-team3-develop-dev-deploy.development.krci-dev.cloudmentor.academy

# Authentication Configuration
app.auth.max-failed-attempts=5
app.auth.lockout-minutes=15

# Logging
logging.level.org.springframework.data.mongodb=DEBUG
