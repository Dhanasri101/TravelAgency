# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.database=travelagency

# Server Configuration
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.ttl-hours=24

# CORS Configuration
app.cors.allowed-origins=http://localhost:[*],https://localhost:[*],https://sprint1-run23-team3-develop-dev-deploy.development.krci-dev.cloudmentor.academy,http://team3-frontend-bucket.s3-website.eu-west-3.amazonaws.com

# Authentication Configuration
app.auth.max-failed-attempts=5
app.auth.lockout-minutes=15

# Logging
logging.level.org.springframework.data.mongodb=DEBUG

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# RabbitMQ (set app.rabbitmq.enabled=true to activate event publishing)
app.rabbitmq.enabled=true

spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

app.rabbitmq.exchange=travel-agency.exchange
app.rabbitmq.queue=booking.events.queue
app.rabbitmq.routing-key=booking.event


# AWS S3 Configuration
aws.access-key=${AWS_ACCESS_KEY}
aws.secret-key=${AWS_SECRET_KEY}
aws.session-token=${AWS_SESSION_TOKEN:}
aws.region=${AWS_REGION:eu-west-3}
aws.s3.bucket=${AWS_S3_BUCKET:team3-files-bucket}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

