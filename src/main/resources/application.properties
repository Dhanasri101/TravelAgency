# ?? Server ??????????????????????????????????????????????????????
server.port=8081

# ?? MongoDB ?????????????????????????????????????????????????????
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/reportdb}
spring.data.mongodb.database=reportdb

# ?? RabbitMQ ????????????????????????????????????????????????????
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.exchange=travel-agency.exchange
app.rabbitmq.queue=booking.events.queue
app.rabbitmq.routing-key=booking.event

# ?? AWS SES ??????????????????????????????????????????????????????
# Region where your SES identity is verified (e.g. us-east-1, eu-west-1)
aws.ses.region=${AWS_SES_REGION:us-west-3}

# Static credentials (leave blank to fall back to IAM role / env-vars / ~/.aws/credentials)
aws.ses.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.ses.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
# Optional session token for temporary STS credentials
aws.ses.session-token=${AWS_SESSION_TOKEN:}

# Verified sender identity in SES (must be verified in your AWS account)
app.ses.sender-email=${SES_SENDER_EMAIL:aayush1234sh@gmail.com}

# Travel Agency Head email address to receive weekly reports
app.report.recipient-email=${REPORT_RECIPIENT_EMAIL:aayush8910sh@gmail.com}

# ?? Logging ??????????????????????????????????????????????????????
logging.level.com.epam.edp.demo=INFO
logging.level.org.springframework.amqp=WARN




